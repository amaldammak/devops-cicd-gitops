apiVersion: apps/v1
kind: Deployment
metadata:
  name: satisfaction-core
  namespace: satisfaction-evaluation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: satisfaction-core
  template:
    metadata:
      labels:
        app: satisfaction-core
    spec:
      containers:
        - name: satisfaction-core
          image: amaldammak/satisfaction-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8050
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-credentials
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"