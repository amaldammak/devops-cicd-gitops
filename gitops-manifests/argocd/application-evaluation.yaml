apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: satisfaction-evaluation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitlab.clinisys.local:9999/devops-stage/satisfaction-gitops.git
    targetRevision: main
    path: apps/satisfaction/overlays/evaluation
  destination:
    server: https://kubernetes.default.svc
    namespace: satisfaction-evaluation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
