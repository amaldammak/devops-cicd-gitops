apiVersion: apps/v1
kind: Deployment
metadata:
  name: satisfaction-web
  namespace: satisfaction-evaluation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: satisfaction-web
  template:
    metadata:
      labels:
        app: satisfaction-web
    spec:
      containers:
        - name: satisfaction-web
          image: satisfaction-front:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3