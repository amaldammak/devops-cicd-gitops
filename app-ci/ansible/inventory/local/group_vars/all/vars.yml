# ansible/inventory/local/group_vars/all.yml
---
namespace: satisfaction-evaluation   # utilisé uniquement par les k8s_info d'attente

minikube_addons:
  - ingress
  - default-storageclass

# ============================================================
# Variables GitOps — ArgoCD lit désormais la config applicative
# directement depuis satisfaction-gitops, pas depuis Ansible.
# ============================================================
gitops_repo_url: "http://gitlab.clinisys.local:9999/devops-stage/satisfaction-gitops.git"
gitops_repo_username: "ci-bot"   # ou ton propre username si pas encore de compte dédié
# vault_gitops_repo_token: chiffré via ansible-vault, voir group_vars/vault.yml

# ============================================================
# SUPPRIMÉ (n'existe plus ici, vit dans apps/satisfaction/overlays/evaluation/) :
#   server_port, db_host, db_port, db_name, db_user,
#   image_backend, image_frontend, image_tag,
#   replicas_backend, replicas_frontend
# ============================================================
